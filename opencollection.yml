  content: |-
    # ✅ Add your collections and share with partners

    Postman recommends forking your collections from internal team workspaces to this workspace.

    Here are some useful tips when sharing collections with partners:

    - Add details about the **API keys/tokens** required and steps that cover how to get them
        
    - Make sure any sensitive and repeated data are stored in **environment variables**
        
    - Ensure your collection contains relevant **API documentation** for partners
        
    - Add **example responses** to each request in the collection. For example, this collection has a `GET authenticated user` request with two example responses
        

    ## Resolving Partners' questions and issues

    Partners can ask add use **Postman comments** to ask contextual questions and get help. You can also add links to your support pages or developer forums.
